[tool.poetry]
name = "xp-stats"
version = "0.1.0"
description = "Statistical Library for Online Controlled Experiments"
authors = ["Danil Kazakov"]
license = "MIT"
readme = "README.md"
packages = [{include = "xp_stats"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
scipy = "^1.11.1"
numpy = ">=2.1.0,<2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
